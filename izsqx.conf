# 以 “;” “#” “//“ 开头的为注释行，用于说明！
# 自用配置瞎写: iZuoShou / 2025.05

# 「GeoLite2」来源 二选一 
; https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
; https://github.com/Hackl0us/GeoIP2-CN/raw/release/Country.mmdb

# QuantumultX图标库订阅，打开以下URL，手机端点击图片即可快捷添加
; https://github.com/ddgksf2013/Icon/blob/master/README.md

# general模块内为一些通用的设置参数项
[general]
network_check_url = http://www.apple.com/library/test/success.html
# QuantumultX会对server_check_url指定的网址进行相应测试，以确认节点的可用性
; server_check_url=http://cp.cloudflare.com/generate_204
; server_check_url=http://www.apple.com/generate_204
server_check_url= http://www.gstatic.com/generate_204
; server_check_url=http://detectportal.firefox.com/success.txt

# list中的域名将不使用fake-ip方式, 多个域名用“, ”连接。其它域名则全部采用 fake-ip及远程解析的模式
dns_exclusion_list = *.cmbchina.com, *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, *.pingan.com.cn, id6.me

# 下列表中内容将不经过QuantumultX的处理
excluded_routes=10.0.0.0/8, 127.0.0.0/8, 169.254.0.0/16, 192.0.2.0/24, 192.168.0.0/16, 198.51.100.0/24, 224.0.0.0/4

# IP.js-用于获取、展示节点信息
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js

# 资源解析器，自定义各类远程资源的转换、如节点、规则、filter、复写、rewrite等
resource_parser_url=https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js

; fallback_udp_policy = reject
; udp_drop_list = 443
; udp_whitelist = 1-442, 444-65535
; icmp_auto_reply = true

[dns]
# 禁用系统 DNS（no-system） 以及 ipv6
;no-system
no-ipv6
# 指定dns服务器
server=119.29.29.29
server=119.28.28.28
server=223.6.6.6
server=180.184.1.1
server=8.8.8.8
# 指定域名解析dns
server=/*.qq.com/119.29.29.29
server=/*.qq.com.cn/119.29.29.29
server=/*.tencent.com/119.28.28.28
server=/dl.google.com/119.29.29.29


# 策略组，处理分流规则传递过来的网络请求
[policy]
static=节点选择, direct, proxy, 手动选择, 节点SG, 节点HK, 节点TW, 节点JP, 节点KR, 节点US, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/SCTC.png
static=手动选择, server-tag-regex=^((?!节点).)*$, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Manual.png
# 国内视频策略使用：国内视频App时选direct(直连)，港台视频App时选节点选择（Proxy)
